name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web samples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.3"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Box3D WebAssembly runtime
        run: ./gradlew --no-daemon :box3d:builder:jParser_build_web_wasm

      - name: Verify Box3D WebAssembly runtime
        run: |
          test -f box3d/builder/build/c++/libs/emscripten/box3d.js
          test -f box3d/builder/build/c++/libs/emscripten/box3d.wasm

      - name: Build GitHub Pages site
        run: >-
          ./gradlew --no-daemon
          :samples:gdx:gl:platforms:web:box3d_web_samples_pages_build

      - name: Verify GitHub Pages routes
        run: |
          pages_dir="samples/gdx/gl/platforms/web/build/pages"
          test -f "$pages_dir/index.html"
          test -f "$pages_dir/gdx/gl/js/index.html"
          test -f "$pages_dir/gdx/gl/wasm/index.html"
          test -f "$pages_dir/fdx/gl/js/index.html"
          test -f "$pages_dir/fdx/gl/wasm/index.html"
          test -f "$pages_dir/fdx/webgpu/js/index.html"
          test -f "$pages_dir/fdx/webgpu/wasm/index.html"
          test ! -e "$pages_dir/fdx/js"
          test ! -e "$pages_dir/fdx/wasm"
          test -z "$(find "$pages_dir" -name webgpu.html -print -quit)"
          test -z "$(find "$pages_dir" -type d -name WEB-INF -print -quit)"
          grep -q 'scripts/fdx-loader.js' "$pages_dir/fdx/gl/js/index.html"
          grep -q 'scripts/fdx-loader.js' "$pages_dir/fdx/gl/wasm/index.html"
          grep -q 'scripts/fdx-webgpu-loader.js' "$pages_dir/fdx/webgpu/js/index.html"
          grep -q 'scripts/fdx-webgpu-loader.js' "$pages_dir/fdx/webgpu/wasm/index.html"
          grep -q 'mainClassArgs: \["--graphics=webgpu"\]' \
            "$pages_dir/fdx/webgpu/js/scripts/fdx-webgpu-loader.js"
          grep -q 'mainClassArgs: \["--graphics=webgpu"\]' \
            "$pages_dir/fdx/webgpu/wasm/scripts/fdx-webgpu-loader.js"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: samples/gdx/gl/platforms/web/build/pages

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
